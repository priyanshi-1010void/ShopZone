{% extends "base.html" %}

{% block title %}Sign In — ShopZone{% endblock %}

{% block content %}
<div style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; width: 100%; max-width: 400px; box-shadow: var(--shadow);">

        <div style="text-align: center; margin-bottom: 22px;">
            <h2 style="font-size: 20px; font-weight: 800; color: var(--text);">Sign In to ShopZone</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">Enter your credentials to access your account</p>
        </div>

        <!-- QUICK DEMO LOGIN SHORTCUT BUTTONS -->
        <div style="background: var(--bg-subtle); border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 18px;">
            <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; text-align: center;">
                Fast Demo Login
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button type="button" class="btn btn-sm btn-secondary" onclick="fillLogin('rahul@gmail.com', 'rahul123')">
                    Customer Demo
                </button>
                <button type="button" class="btn btn-sm btn-outline" onclick="fillLogin('admin@shop.com', 'admin123')">
                    Admin Demo
                </button>
            </div>
        </div>

        <form action="/login" method="POST">
            <div style="margin-bottom: 14px;">
                <label style="display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--text);">Email Address</label>
                <input type="email" id="loginEmail" name="email" class="coupon-input" style="width: 100%;" placeholder="name@example.com" required>
            </div>

            <div style="margin-bottom: 18px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <label style="font-size: 12px; font-weight: 700; color: var(--text);">Password</label>
                    <a href="javascript:void(0);" style="font-size: 12px; color: var(--text-muted); text-decoration: none;">Forgot?</a>
                </div>
                <input type="password" id="loginPassword" name="password" class="coupon-input" style="width: 100%;" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-block btn-lg">
                Sign In →
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Don't have an account? <a href="/register" style="color: var(--text); font-weight: 700; text-decoration: underline;">Create one</a>
        </div>

        <div style="text-align: center; margin-top: 12px; font-size: 12px;">
            <a href="/admin/login" style="color: var(--text-muted); text-decoration: none;">
                Admin Portal Login ↗
            </a>
        </div>
    </div>
</div>

<script>
function fillLogin(email, pass) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pass;
}
</script>
{% endblock %}
